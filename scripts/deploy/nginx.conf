# /etc/nginx/sites-available/mojasame
# certbot --nginx بلوک ۴۴۳ و ریدایرکت TLS را خودش اضافه می‌کند.

server {
    listen 80;
    listen [::]:80;
    server_name mojasamesaidi.ir www.mojasamesaidi.ir 185.239.0.11;

    # آپلود تصویر محصول تا ۵ مگابایت است (UPLOAD_MAX_IMAGE_MB)؛ با کمی حاشیه.
    client_max_body_size 10m;

    # هدرهای امنیتی در next.config.ts ست می‌شوند؛ اینجا تکرارشان نمی‌کنیم
    # تا یک منبع حقیقت بماند.

    # دارایی‌های بیلد هش‌دارند و تغییرناپذیرند.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
